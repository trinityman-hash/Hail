name: Build Android & Deploy Server

on: [push]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Setup JDK
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build Android App
      run: |
        # Assuming you have an Android project structure
        # If you just have the Java files, you need to package them
        echo "Building APK..."
        # (Simplified: In a real scenario, you'd use gradle)
        # For this demo, we assume the APK is built locally and uploaded
        # Or you use the "android-actions" to build

    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: android-app
        path: app/build/outputs/apk/debug/app-debug.apk

  deploy-server:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install Dependencies
      run: npm install

    - name: Start Server
      run: node server.js
      env:
        PORT: 3000
